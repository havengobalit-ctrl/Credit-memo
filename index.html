<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Memo</title>
<style>
  :root{
    --yellow-bg:#FFF7D6; --yellow-border:#E8C547;
    --blue-bg:#E7F0FC; --blue-border:#5B8DEF;
    --green-bg:#E7F7EC; --green-border:#3FA65E;
    --ink:#1F2430; --muted:#5B6270; --paper:#FFFFFF; --page:#F3F4F6;
    --line:#D8DCE3;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#14161A; --paper:#1D2026; --ink:#EDEFF3; --muted:#9BA1AE; --line:#31353E;
      --yellow-bg:#3A3418; --blue-bg:#152238; --green-bg:#12291B;
    }
  }
  :root[data-theme="dark"]{
    --page:#14161A; --paper:#1D2026; --ink:#EDEFF3; --muted:#9BA1AE; --line:#31353E;
    --yellow-bg:#3A3418; --blue-bg:#152238; --green-bg:#12291B;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:'Sarabun','Noto Sans Thai',Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .sheet{max-width:820px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .section{padding:20px 24px;border-bottom:1px solid var(--line);}
  .section:last-child{border-bottom:none;}
  .tag{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-bottom:10px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}

  .yellow{background:var(--yellow-bg);border-left:5px solid var(--yellow-border);}
  .blue{background:var(--blue-bg);border-left:5px solid var(--blue-border);}
  .green{background:var(--green-bg);border-left:5px solid var(--green-border);}

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  input, textarea{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
    font-size:14px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  input:focus, textarea:focus{outline:2px solid var(--blue-border);outline-offset:1px;}
  textarea.desc{resize:none;overflow:hidden;min-height:36px;line-height:1.4;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}
  @media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;margin-top:8px;}
  thead th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);}
  td{padding:6px;vertical-align:top;}
  td.num input{text-align:right;}
  .row-actions{white-space:nowrap;}
  .btn{
    border:1px solid var(--blue-border);background:transparent;color:var(--blue-border);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  .btn.remove{border-color:#C0554A;color:#C0554A;}
  .dup-badge{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid #C0554A;border-radius:10px;color:#E5766B;font-size:11px;white-space:nowrap;}
  tr.dup-row{background:rgba(192,85,74,.10);}
  .btn.primary{background:var(--blue-border);color:#fff;border:none;}
  .btn.ghost{border-color:var(--line);color:var(--muted);}
  .toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .total-row{display:flex;justify-content:flex-end;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);align-items:center;}
  .total-row .amount{font-size:18px;font-weight:700;}

  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .summary-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;}
  .summary-card .amount{font-size:20px;font-weight:700;margin-top:4px;}
  @media (max-width:520px){.summary-grid{grid-template-columns:1fr;}}

  .print-bar{max-width:820px;margin:0 auto 12px;display:flex;justify-content:flex-end;}
  @media print{ .print-bar,.toolbar,.btn,.tabs{display:none !important;} body{background:#fff;padding:0;} .sheet{box-shadow:none;border:none;} }

  .memo-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .memo-card .meta{font-size:13px;}
  .memo-card .meta b{font-size:14px;}
  .memo-card .meta .muted{color:var(--muted);font-size:12px;}
  .memo-actions{display:flex;gap:6px;}
  .sum-opt{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
  .sum-opt input[type="checkbox"]{width:16px;height:16px;flex:none;accent-color:var(--green-border);}
  .sum-label{display:flex;flex-direction:column;line-height:1.35;}
  textarea.sum-desc{width:100%;flex:1;resize:none;overflow:hidden;min-height:44px;line-height:1.35;font-size:13.5px;}
  .sum-label .en{font-size:12px;color:var(--muted);}

  .tabs{max-width:820px;margin:0 auto 12px;display:flex;gap:8px;}
  .tab-btn{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px 8px 0 0;padding:8px 18px;font-size:14px;cursor:pointer;font-family:inherit;}
  .tab-btn.active{color:var(--ink);font-weight:700;border-bottom-color:var(--paper);background:var(--paper);border-color:var(--blue-border);}

  #dbTable{width:100%;border-collapse:collapse;}
  #dbTable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  #dbTable td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  #dbTable .db-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* ---- Formatted print / PDF output (matches official Credit Memo document) ---- */
  #printSheet{display:none;}
  @media print{
    /* สำคัญ: ห้ามใช้ position:absolute กับ #printSheet เพราะจะทำให้ตารางหลุดจาก
       การไหลปกติของหน้าเอกสาร ผลคือ thead (ส่วนหัวที่ต้องพิมพ์ซ้ำ) จะไม่ตามไป
       หน้า 2/3/4 — ให้ซ่อนส่วนอื่นด้วย display:none แล้วปล่อยให้ #printSheet
       ไหลตามปกติแทน จึงจะเบรกหน้าและพิมพ์หัวตารางซ้ำได้ถูกต้อง */
    body > *:not(#printSheet){display:none !important;}
    body{margin:0;}
    #printSheet{
      display:block;
      width:100%;
    }
    @page{margin:16mm;}
  }
  #printSheet{
    font-family:'Times New Roman',Georgia,serif; color:#000; font-size:13px; line-height:1.5;
    max-width:190mm; margin:0 auto;
  }
  #printSheet .p-title{text-align:center;font-size:20px;font-weight:700;letter-spacing:.03em;margin-bottom:2px;}
  #printSheet .p-company{text-align:center;margin-bottom:14px;}
  #printSheet .p-company .name{font-weight:700;font-size:15px;}
  #printSheet .p-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12.5px;white-space:nowrap;}
  #printSheet .p-toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:10px;}
  #printSheet .p-toprow .p-block{margin-bottom:0;flex:1;}
  #printSheet .p-block{padding-top:0;margin-bottom:10px;}
  #printSheet .p-block .label{font-weight:700;font-size:12px;margin-bottom:3px;}
  #printSheet table{width:100%;border-collapse:collapse;margin:10px 0;}
  #printSheet th{border-bottom:1.5px solid #000;text-align:left;font-size:12px;padding:5px 6px;}
  #printSheet th:nth-child(2),#printSheet th:nth-child(3){text-align:right;}
  #printSheet td{padding:5px 6px;border-bottom:1px solid #ccc;font-size:12.5px;}
  #printSheet td:nth-child(2),#printSheet td:nth-child(3){text-align:right;white-space:nowrap;}
  #printSheet .p-summary{margin-top:14px;border-top:1.5px solid #000;padding-top:6px;}
  #printSheet .p-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #999;font-size:13px;}
  #printSheet .p-row.total{border-bottom:none;border-top:1.5px solid #000;font-weight:700;font-size:14.5px;margin-top:4px;padding-top:8px;}
  #printSheet .p-remark{font-size:11.5px;color:#333;font-style:italic;padding:0 0 6px 4px;}
  #printSheet .p-summary-text{font-family:inherit;font-size:13px;white-space:pre-wrap;margin:0;border-top:1.5px solid #000;padding-top:8px;}
  #printSheet .p-notes{margin-top:18px;font-size:12px;}
  #printSheet .p-notes .label{font-weight:700;margin-bottom:4px;}
  #printSheet .p-notes p{margin:4px 0;white-space:pre-wrap;}
#printSheet .p-page-table{
    width:100%;
    border-collapse:collapse;
    margin:0;
  }
  #printSheet .p-page-table > thead{display:table-header-group;}
  #printSheet .p-page-table > tbody{display:table-row-group;}
  #printSheet thead{display:table-header-group;}
  /* หมายเหตุ: ห้ามใส่ page-break-inside:avoid ให้ tbody tr แบบเหมาทุกแถว —
     เมื่อใช้ร่วมกับ thead ที่พิมพ์ซ้ำทุกหน้า Chrome จะมีบั๊ก (crbug.com/24826: repeating
     header forces a strut on the rows) ทำให้แถวที่อยู่ตรงรอยตัดหน้าโดน "ยืด" จนเกิดช่องว่าง
     เปล่าๆ ขนาดใหญ่ และบางครั้งข้อมูลแถวเดิมถูกพิมพ์ซ้ำข้ามไปอีกหน้า (ข้อมูลซ้ำ 2 หน้า)
     จึงปล่อยให้ทุกแถวตัดหน้าได้ตามปกติ ไม่บังคับ avoid เลย — แถวแต่ละอันสั้นแค่บรรทัดเดียวอยู่แล้ว
     จึงไม่มีปัญหาเรื่องถูกตัดครึ่งกลางแถว */
  #printSheet .p-page-table > thead > tr > th.p-letterhead-cell{
    border:0;
    padding:0 0 10px 0;
    text-align:left;
    font-weight:normal;
  }
  #printSheet .p-page-table > thead > tr.p-col-head > th{
    border-bottom:1.5px solid #000;
    text-align:left;
    font-size:12px;
    padding:5px 6px;
    font-weight:600;
  }
  #printSheet .p-page-table > thead > tr.p-col-head > th:nth-child(2),
  #printSheet .p-page-table > thead > tr.p-col-head > th:nth-child(3){
    text-align:right;
  }
  #printSheet td.p-wide-cell{border:0;padding:0;}
  #printSheet td:first-child{white-space:pre-wrap;}
  #printSheet .p-row span:first-child{white-space:pre-wrap;}
  #printSheet .p-repeat-header{
    width:100%;
    font-family:'Times New Roman',Georgia,serif;
    color:#000;
    margin-bottom:10px;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  #printSheet .p-repeat-title{
    text-align:center;
    font-size:20px;
    font-weight:700;
    letter-spacing:.03em;
    margin-bottom:2px;
  }
  #printSheet .p-repeat-company{
    text-align:center;
    margin-bottom:10px;
  }
  #printSheet .p-repeat-company .name{
    font-weight:700;
    font-size:15px;
  }
  #printSheet .p-repeat-toprow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:8px;
  }
  #printSheet .p-repeat-toprow .p-block{
    margin-bottom:0;
    flex:1;
  }
  #printSheet .p-repeat-reference{
    margin-top:2px;
    padding-top:6px;
  }
  #printSheet .p-repeat-reference .label{
    font-weight:700;
    font-size:12px;
    margin-bottom:2px;
  }
  /* ให้ส่วนท้าย (สรุปยอด/รายละเอียด) ดันไปชนขอบล่างสุดของหน้า: ทำให้ .p-print-page เป็น
     flex column สูงเท่าพื้นที่ใช้งานจริงของกระดาษ (A4 ลบ margin บน-ล่าง 16mm) แล้วให้
     .p-footer-push มี margin-top:auto ไปกินพื้นที่ว่างทั้งหมดที่เหลือ ดันตัวเองลงล่างสุด */
  #printSheet .p-print-page{
    display:flex;
    flex-direction:column;
    min-height:265mm;
  }
  #printSheet .p-footer-push{
    margin-top:auto;
  }
  .popup-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px;}
  .popup-overlay.show{display:flex;}
  .popup-card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:28px 34px;min-width:260px;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .popup-icon{font-size:38px;line-height:1;margin-bottom:10px;}
  .popup-msg{font-size:16px;font-weight:600;}
  .popup-sub{font-size:13px;color:var(--muted);margin-top:6px;}
  .popup-spinner{width:38px;height:38px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--blue-border);border-radius:50%;animation:popspin .8s linear infinite;}
  @keyframes popspin{to{transform:rotate(360deg);}}
  .popup-close{margin-top:16px;}
  @media print{.popup-overlay{display:none !important;}}
  .cust-suggest{position:absolute;left:0;right:0;z-index:50;display:none;max-height:240px;overflow-y:auto;background:var(--paper);border:1px solid var(--blue-border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .cust-item{padding:8px 10px;font-size:13.5px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line);}
  .cust-item:last-child{border-bottom:none;}
  .cust-item:hover,.cust-item.active{background:var(--blue-bg);}
</style>
</head>
<body>

<div class="print-bar"><button class="btn ghost" onclick="printMemo()">พิมพ์ / บันทึกเป็น PDF</button></div>

<div class="tabs">
  <button class="tab-btn active" id="tabFormBtn" onclick="showTab('form')">กรอกฟอร์ม</button>
  <button class="tab-btn" id="tabDbBtn" onclick="showTab('db')">ฐานข้อมูล</button>
</div>

<div id="printSheet"></div>

<div class="sheet" id="formView">

  <!-- YELLOW: HEADER -->
  <section class="section yellow">
    <div class="tag"></div>
    <h1>Credit Memo</h1>
    <div class="grid2">
      <div class="field">
        <label>บริษัทผู้ออก (Company)</label>
        <input id="companyName" value="Haven Thaiconsulting Co.,Ltd. (Head Office)">
      </div>
      <div class="field">
        <label>Tax ID</label>
        <input id="companyTax" value="0205567040910">
      </div>
      <div class="field" style="grid-column:1 / -1;">
        <label>ที่อยู่บริษัท</label>
        <input id="companyAddr" value="283/9 Moo 8, Thungsukhla Sriracha, Chonburi 20230">
      </div>
      <div class="field">
        <label>เลขที่เอกสาร (No.)</label>
        <input id="memoNo" value="CM2609002" oninput="checkDupNow()">
        <div id="dupWarn" style="display:none;margin-top:4px;font-size:12.5px;color:#E5766B;"></div>
      </div>
      <div class="field">
        <label>วันที่ (Date)</label>
        <input id="memoDate" type="date" value="2026-09-09">
      </div>
      <div class="field">
        <label>ลูกค้า (Customer)</label>
        <input id="custName" value="Xintai Manufacturing Co.,Ltd." autocomplete="off" oninput="onCustNameInput()">
        <div id="custSuggest" class="cust-suggest"></div>
        <div id="custDbStatus" style="margin-top:4px;font-size:11.5px;color:var(--muted);"></div>
        <div id="custHint" style="display:none;margin-top:4px;font-size:12.5px;color:var(--green-border);"></div>
      </div>
      <div class="field">
        <label>Tax ID ลูกค้า</label>
        <input id="custTax" value="0205569020207">
      </div>
      <div class="field" style="grid-column:1 / -1;">
        <label>ที่อยู่ลูกค้า</label>
        <input id="custAddr" value="903 Moo 6, Nongyai, Nongyai, Chonburi">
      </div>
      <div class="field">
        <label>Ref. Invoice No.</label>
        <input id="refInv" placeholder="เช่น PI RE no.2026004">
      </div>
      <div class="field">
        <label>รายการที่ยกเลิก (Cancelled Item)</label>
        <input id="refItem" placeholder="เช่น Service for apply factory licence">
      </div>
    </div>
  </section>

  <!-- BLUE: CONTENT / LINE ITEMS -->
  <section class="section blue">
    <div class="tag"></div>
    <table id="itemsTable">
      <thead>
        <tr><th style="width:55%;">DESCRIPTION</th><th style="width:20%;">UNIT PRICE</th><th style="width:20%;">AMOUNT</th><th></th></tr>
      </thead>
      <tbody id="itemsBody">
        <tr>
          <td><textarea class="desc" rows="1" placeholder="" oninput="autoGrow(this)"></textarea></td>
          <td class="num"><input type="number" class="unitprice" step="0.01" placeholder="0.00" oninput="syncAmount(this)"></td>
          <td class="num"><input type="number" class="amount" step="0.01" placeholder="0.00"></td>
          <td class="row-actions"><button class="btn remove" onclick="removeRow(this)">ลบ</button></td>
        </tr>
      </tbody>
    </table>
    <div class="toolbar">
      <button class="btn" onclick="addRow('itemsBody')">+ เพิ่มรายการ</button>
    </div>
    <span id="itemsTotal" style="display:none;">0.00</span>
  </section>

  <!-- GREEN: SUMMARY -->
  <section class="section green">
    <div class="tag">ส่วนสรุป / บันทึก — พิมพ์รายละเอียดได้อิสระ</div>
    <table id="summaryTable">
      <thead>
        <tr><th style="width:56%;">DESCRIPTION</th><th style="width:20%;">UNIT PRICE</th><th style="width:20%;">AMOUNT</th><th style="width:4%;"></th></tr>
      </thead>
      <tbody id="summaryBody"></tbody>
    </table>
    <div class="field" style="margin-top:6px;">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><button class="btn" onclick="addSummaryRow()">+ เพิ่มแถว</button><label style="font-size:11.5px;">แก้ข้อความได้อิสระ / ลบแถวที่ไม่ใช้ได้ — ข้อความเริ่มต้นจะกลับมาทุกครั้งที่เริ่มรายการใหม่</label></div>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>รายละเอียด (พิมพ์ทีละบรรทัด — จะขึ้นเลขข้อให้อัตโนมัติตอนพิมพ์)</label>
      <textarea id="details" rows="6" placeholder="">รายละเอียด
1.ยอดเครดิตนี้จะเก็บเพื่อใช้หักลบกับค่าบริการในอนาคต
This credit is held for future service dections.
2.ยอดเงินดังกล่าวคำนวณจากยอดที่ชำระจริงหลังหักส่วนลดแล้ว
The above amount is calculated based on the actual amount paid after discount.</textarea>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="saveBtn" onclick="saveMemo()">บันทึกลงระบบ (ทุกคนเห็น)</button>
      <button class="btn ghost" onclick="newMemo()">+ เริ่มรายการใหม่</button>
      <span id="saveStatus" style="font-size:12.5px;color:var(--muted);align-self:center;"></span>
      <span id="editingBadge" style="font-size:12.5px;color:var(--blue-border);align-self:center;display:none;"></span>
    </div>
  </section>

  <!-- (list moved to dbView tab below) -->

</div>

<div class="sheet" id="dbView" style="display:none;">
  <section class="section" style="border-left:5px solid var(--muted);">
    <div class="tag">ฐานข้อมูล (Google Sheet — ทุกคนเห็นชุดเดียวกัน)</div>
    <div class="toolbar" style="margin-top:0;margin-bottom:10px;">
      <button class="btn" onclick="refreshList(true)">รีเฟรช</button>
    </div>
    <div style="overflow-x:auto;">
      <table id="dbTable">
        <thead>
          <tr>
            <th>No.</th><th>วันที่</th><th>ลูกค้า</th><th>ยอดรวม AMOUNT</th><th>บันทึก/แก้ไขล่าสุด</th><th>การจัดการ</th>
          </tr>
        </thead>
        <tbody id="memoList"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const DEFAULT_SUMMARY = [
  'ยอดเงินเครดิตคงเหลือสุทธิ\nNET CREDIT BALANCE',
  'มูลค่ารวมรายการใหม่สุทธิ\nNet Total of New Items',
  'ยกเครดิตคงเหลือไปยอดรอบหน้า\nRemaining Credit',
  'คืนเงินส่วนต่างจากยอดชำระที่คงเหลือ\nRefund of Remaining Payment Balance'
];
function addSummaryRow(desc, unitPrice, amount){
  const tbody = document.getElementById('summaryBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><textarea class="sum-desc" rows="2" placeholder="รายละเอียด" oninput="autoGrow(this)"></textarea></td>
    <td class="num"><input type="number" class="unitprice" step="0.01" placeholder="0.00" oninput="syncAmount(this)"></td>
    <td class="num"><input type="number" class="amount" step="0.01" placeholder="0.00"></td>
    <td class="row-actions"><button class="btn remove" onclick="removeRow(this)">ลบ</button></td>`;
  const ta = tr.querySelector('.sum-desc');
  ta.value = desc || '';
  tr.querySelector('.unitprice').value = unitPrice || '';
  tr.querySelector('.amount').value = (amount === '' || amount == null) ? '' : amount;
  tbody.appendChild(tr);
  autoGrow(ta);
}
function resetSummaryRows(){
  document.getElementById('summaryBody').innerHTML = '';
  DEFAULT_SUMMARY.forEach(d => addSummaryRow(d, '', '0.00'));
}
function syncAmount(unitInput){
  const row = unitInput.closest('tr');
  const amt = row.querySelector('.amount');
  if(!amt.dataset.touched){ amt.value = unitInput.value; }
}
document.getElementById('itemsBody').addEventListener('input', e=>{
  if(e.target.classList.contains('amount')) e.target.dataset.touched = "1";
  if(e.target.classList.contains('amount') || e.target.classList.contains('unitprice')) updateTotal();
});
function addRow(tbodyId){
  const tbody = document.getElementById(tbodyId || 'itemsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><textarea class="desc" rows="1" placeholder="รายละเอียดรายการ" oninput="autoGrow(this)"></textarea></td>
    <td class="num"><input type="number" class="unitprice" step="0.01" placeholder="0.00" oninput="syncAmount(this)"></td>
    <td class="num"><input type="number" class="amount" step="0.01" placeholder="0.00"></td>
    <td class="row-actions"><button class="btn remove" onclick="removeRow(this)">ลบ</button></td>`;
  tbody.appendChild(tr);
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight) + 'px';
}
function removeRow(btn){
  const tbody = btn.closest('tbody');
  if (tbody.children.length > (tbody.id === 'summaryBody' ? 0 : 1)){ btn.closest('tr').remove(); if (tbody.id === 'itemsBody') updateTotal(); }
}
function updateTotal(){
  let sum = 0;
  document.querySelectorAll('#itemsBody .amount').forEach(i=>{ sum += parseFloat(i.value) || 0; });
  document.getElementById('itemsTotal').textContent = sum.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
updateTotal();
resetSummaryRows();
document.querySelectorAll('textarea.desc, textarea.sum-desc').forEach(autoGrow);

// ---- Shared backend (Google Apps Script Web App + Google Sheet) ----
// วาง Web app URL จาก Apps Script ตรงนี้ (ดูวิธีทำใน apps_script_backend.gs)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyh6KDP9xCEnHppoUMANwuJaLa4osuSXiVsJ5kq-nfvCZRzy-2RBuajdOShJ0vPhqz7Cg/exec';

function showTab(name){
  const isForm = name === 'form';
  document.getElementById('formView').style.display = isForm ? '' : 'none';
  document.getElementById('dbView').style.display = isForm ? 'none' : '';
  document.getElementById('tabFormBtn').classList.toggle('active', isForm);
  document.getElementById('tabDbBtn').classList.toggle('active', !isForm);
  if (!isForm) refreshList(true);
}

if (SCRIPT_URL.indexOf('PASTE_YOUR') !== 0) { fetchListSilently().then(checkDupNow); loadCustomers(); }
if (SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
  document.getElementById('saveStatus').textContent = 'ยังไม่ได้ตั้งค่า SCRIPT_URL ในไฟล์นี้';
}

function collectData(){
  const items = [];
  document.querySelectorAll('#itemsBody tr').forEach(tr=>{
    items.push({
      desc: tr.querySelector('.desc').value,
      unitPrice: tr.querySelector('.unitprice').value,
      amount: tr.querySelector('.amount').value,
    });
  });
  const summaryItems = [];
  document.querySelectorAll('#summaryBody tr').forEach(tr=>{
    summaryItems.push({
      desc: tr.querySelector('.sum-desc').value,
      unitPrice: tr.querySelector('.unitprice').value,
      amount: tr.querySelector('.amount').value,
    });
  });
  return {
    companyName: val('companyName'), companyTax: val('companyTax'), companyAddr: val('companyAddr'),
    memoNo: val('memoNo'), memoDate: val('memoDate'),
    custName: val('custName'), custTax: val('custTax'), custAddr: val('custAddr'),
    refInv: val('refInv'), refItem: val('refItem'),
    items: items,
    itemsTotal: document.getElementById('itemsTotal').textContent,
    summaryItems: summaryItems,
    details: val('details'),
  };
}
function val(id){ return document.getElementById(id).value; }

// ---- ตรวจเลขที่เอกสารซ้ำ / จัดรูปวันที่ ----
function normNo(v){ return String(v||'').trim().toLowerCase(); }
function normalizeDate(v){
  if (!v) return '';
  const str = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const d = new Date(str);
  if (isNaN(d)) return str;
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function findDuplicates(memoNo, list){
  const n = normNo(memoNo);
  if (!n) return [];
  return (list || []).filter(d => normNo(d.memoNo) === n && d.id !== window._currentId);
}
function checkDupNow(){
  const el = document.getElementById('dupWarn');
  if (!el) return;
  const dups = findDuplicates(document.getElementById('memoNo').value, window._memoCache);
  if (dups.length){
    el.style.display = '';
    el.textContent = '⚠ เลขที่นี้ซ้ำกับรายการที่มีอยู่แล้ว ' + dups.length + ' รายการ';
  } else { el.style.display = 'none'; el.textContent = ''; }
}
// ---- ฐานข้อมูลลูกค้า (แท็บ "Data" ใน Google Sheet) : พิมพ์ชื่อบางส่วน > เลือก > เติม Tax ID / ที่อยู่ ----
window._customers = [];
window._suggIdx = -1;
function normName(v){ return String(v||'').replace(/\s+/g,' ').trim().toLowerCase(); }
async function loadCustomers(){
  const st = document.getElementById('custDbStatus');
  try{
    const res = await fetch(SCRIPT_URL + '?action=customers');
    const list = await res.json();
    window._customers = Array.isArray(list) ? list.filter(c => c && c.name) : [];
  }catch(e){
    window._customers = [];
  }
  if (window._customers.length){
    st.style.color = 'var(--muted)';
    st.textContent = 'ฐานข้อมูลลูกค้า ' + window._customers.length + ' ราย — พิมพ์ชื่อบางส่วนแล้วเลือกจากรายการ';
  } else {
    st.style.color = '#E5766B';
    st.textContent = '⚠ โหลดฐานข้อมูลลูกค้าไม่ได้ (ตรวจว่า Deploy Apps Script เวอร์ชันล่าสุดแล้ว และมีแท็บ Data)';
  }
}
function hideCustSuggest(){
  const box = document.getElementById('custSuggest');
  box.style.display = 'none';
  box.innerHTML = '';
  window._suggIdx = -1;
}
function pickCustomer(c){
  setVal('custName', c.name);
  setVal('custTax', c.tax);
  setVal('custAddr', c.address);
  hideCustSuggest();
  const hint = document.getElementById('custHint');
  hint.style.display = '';
  hint.textContent = '✓ เติมเลขผู้เสียภาษีและที่อยู่จากฐานข้อมูลลูกค้าแล้ว';
}
function showCustSuggest(matches){
  const box = document.getElementById('custSuggest');
  box.innerHTML = '';
  window._suggIdx = -1;
  if (!matches.length){ hideCustSuggest(); return; }
  matches.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'cust-item';
    d.textContent = c.name;
    d.addEventListener('mousedown', ev=>{ ev.preventDefault(); pickCustomer(c); });
    box.appendChild(d);
  });
  const inp = document.getElementById('custName');
  box.style.top = (inp.offsetTop + inp.offsetHeight + 2) + 'px';
  box.style.display = 'block';
}
function onCustNameInput(){
  const hint = document.getElementById('custHint');
  const key = normName(document.getElementById('custName').value);
  const exact = key ? window._customers.find(x => normName(x.name) === key) : null;
  if (exact){ pickCustomer(exact); return; }
  hint.style.display = 'none';
  hint.textContent = '';
  const matches = key ? window._customers.filter(x => normName(x.name).indexOf(key) !== -1).slice(0, 8) : [];
  showCustSuggest(matches);
}
(function(){
  const inp = document.getElementById('custName');
  inp.parentElement.style.position = 'relative';
  inp.addEventListener('keydown', ev=>{
    const items = document.querySelectorAll('#custSuggest .cust-item');
    if (!items.length) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault();
      window._suggIdx = (window._suggIdx + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((it,i)=> it.classList.toggle('active', i === window._suggIdx));
      items[window._suggIdx].scrollIntoView({block:'nearest'});
    } else if (ev.key === 'Enter' && window._suggIdx >= 0){
      ev.preventDefault();
      items[window._suggIdx].dispatchEvent(new MouseEvent('mousedown'));
    } else if (ev.key === 'Escape'){
      hideCustSuggest();
    }
  });
  inp.addEventListener('blur', ()=> setTimeout(hideCustSuggest, 150));
})();

async function fetchListSilently(){
  try{
    const res = await fetch(SCRIPT_URL);
    const list = await res.json();
    if (Array.isArray(list)) { window._memoCache = list; return list; }
  }catch(e){}
  return null;
}

// ---- Popup กลางจอ (กำลังทำงาน / สำเร็จ / ผิดพลาด) ----
let _popupTimer = null;
function showPopup(state, msg, sub){
  clearTimeout(_popupTimer);
  const icon = document.getElementById('popupIcon');
  if (state === 'loading') icon.innerHTML = '<div class="popup-spinner"></div>';
  else if (state === 'success') icon.innerHTML = '<div class="popup-icon" style="color:var(--green-border);">✓</div>';
  else icon.innerHTML = '<div class="popup-icon" style="color:#E5766B;">⚠</div>';
  document.getElementById('popupMsg').textContent = msg || '';
  document.getElementById('popupSub').textContent = sub || '';
  document.getElementById('popupClose').style.display = (state === 'error') ? '' : 'none';
  document.getElementById('popup').classList.add('show');
  if (state === 'success') _popupTimer = setTimeout(hidePopup, 1400);
}
function hidePopup(){
  clearTimeout(_popupTimer);
  document.getElementById('popup').classList.remove('show');
}
async function postToBackend(body){
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // กัน CORS preflight
    body: JSON.stringify(body)
  });
  let out = null;
  try{ out = await res.json(); }catch(e){}
  if (out && out.status === 'error') throw new Error(out.message || 'backend error');
}

async function saveMemo(){
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = '';
  showPopup('loading', 'กำลังบันทึก...', 'กรุณารอสักครู่');
  try{
    const data = collectData();
    const isUpdate = !!window._currentId;
    // เช็กเลขที่ซ้ำกับข้อมูลล่าสุดในระบบ (ดึงใหม่ก่อนบันทึก เผื่อมีคนอื่นเพิ่งบันทึก)
    const fresh = await fetchListSilently();
    const dups = findDuplicates(data.memoNo, fresh || window._memoCache);
    if (dups.length){
      const lines = dups.slice(0,3).map(d => '• ' + (d.memoNo||'-') + ' | ' + (d.custName||'-') + ' | ' + (normalizeDate(d.memoDate)||'-') + ' | ' + (d.itemsTotal||'0.00')).join('\n');
      hidePopup();
      const ok = confirm('⚠ เลขที่เอกสาร "' + data.memoNo + '" ซ้ำกับรายการที่มีอยู่แล้ว ' + dups.length + ' รายการ:\n' + lines + '\n\nต้องการบันทึกต่อหรือไม่?\n(กด Cancel เพื่อกลับไปแก้เลขที่)');
      if (!ok){
        statusEl.textContent = 'ยกเลิกการบันทึก — เลขที่เอกสารซ้ำ';
        document.getElementById('memoNo').focus();
        checkDupNow();
        return;
      }
      showPopup('loading', 'กำลังบันทึก...', 'กรุณารอสักครู่');
    }
    data.id = isUpdate ? window._currentId : ('m' + Date.now());
    data.savedAt = isUpdate ? (window._currentSavedAt || Date.now()) : Date.now();
    await postToBackend({ type: isUpdate ? 'update' : 'save', data: data });
    window._currentId = data.id;
    window._currentSavedAt = data.savedAt;
    setEditingBadge(data.memoNo);
    showPopup('success', isUpdate ? 'อัปเดตแล้ว' : 'บันทึกแล้ว', data.memoNo || '');
    refreshList();
  }catch(e){
    showPopup('error', 'บันทึกไม่สำเร็จ', 'ตรวจสอบ SCRIPT_URL / การเชื่อมต่ออินเทอร์เน็ต');
  }
}

function newMemo(){
  window._currentId = null;
  window._currentSavedAt = null;
  setEditingBadge(null);
  document.querySelectorAll('#formView input, #formView textarea').forEach(el=>{
    if (el.id === 'memoDate' || el.id === 'details' || el.classList.contains('sum-check') || el.classList.contains('sum-desc')) return;
    el.value = '';
  });
  resetSummaryRows();   // คืนแถวและข้อความเดิมทุกครั้งที่เริ่มรายการใหม่
  const tbody = document.getElementById('itemsBody');
  tbody.innerHTML = '<tr><td><textarea class="desc" rows="1" oninput="autoGrow(this)"></textarea></td><td class="num"><input type="number" class="unitprice" step="0.01" oninput="syncAmount(this)"></td><td class="num"><input type="number" class="amount" step="0.01"></td><td class="row-actions"><button class="btn remove" onclick="removeRow(this)">ลบ</button></td></tr>';
  updateTotal();
  document.getElementById('saveStatus').textContent = 'เริ่มรายการใหม่แล้ว';
  setTimeout(()=>{ document.getElementById('saveStatus').textContent=''; }, 2000);
}

function setEditingBadge(memoNo){
  const el = document.getElementById('editingBadge');
  if (memoNo){ el.style.display=''; el.textContent = `กำลังแก้ไข: ${memoNo} (บันทึกซ้ำจะทับของเดิม)`; }
  else { el.style.display='none'; el.textContent=''; }
}

async function refreshList(withPopup){
  const el = document.getElementById('memoList');
  if (withPopup) showPopup('loading', 'กำลังโหลดข้อมูล...', 'กรุณารอสักครู่');
  try{
    const res = await fetch(SCRIPT_URL);
    const list = await res.json();
    if (!Array.isArray(list)) throw new Error((list && list.message) || 'invalid response');
    renderList(list);
    if (withPopup) hidePopup();
  }catch(e){
    el.innerHTML = '<tr><td colspan="6" style="color:var(--muted);font-size:13px;">โหลดรายการไม่สำเร็จ</td></tr>';
    if (withPopup) showPopup('error', 'โหลดข้อมูลไม่สำเร็จ', 'ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วกดรีเฟรชอีกครั้ง');
  }
}

function renderList(list){
  const el = document.getElementById('memoList');
  el.innerHTML = '';
  if (!list || !list.length){
    el.innerHTML = '<tr><td colspan="6" style="color:var(--muted);font-size:13px;">ยังไม่มีรายการที่บันทึกไว้</td></tr>';
    return;
  }
  const counts = {};
  list.forEach(d=>{ const k = normNo(d.memoNo); if (k) counts[k] = (counts[k]||0) + 1; });
  list.forEach(data=>{
    const tr = document.createElement('tr');
    const isDup = counts[normNo(data.memoNo)] > 1;
    if (isDup) tr.className = 'dup-row';
    const savedStr = data.savedAt ? new Date(data.savedAt).toLocaleString('th-TH') : '';
    const updatedStr = data.updatedAt ? new Date(data.updatedAt).toLocaleString('th-TH') : '';
    tr.innerHTML = `
      <td>${escapeHtml(data.memoNo||'-')}${isDup ? '<span class="dup-badge">เลขที่ซ้ำ</span>' : ''}</td>
      <td>${escapeHtml(normalizeDate(data.memoDate)||'-')}</td>
      <td>${escapeHtml(data.custName||'-')}</td>
      <td>${escapeHtml(data.itemsTotal||'0.00')}</td>
      <td>${updatedStr ? 'แก้ไข '+updatedStr : 'บันทึก '+savedStr}</td>
      <td class="db-actions">
        <button class="btn" onclick='editFromDb(${JSON.stringify(data.id)})'>แก้ไข</button>
        <button class="btn" onclick='copyMemo(${JSON.stringify(data.id)})'>คัดลอกไปทำต่อ</button>
        <button class="btn remove" onclick='deleteMemo(${JSON.stringify(data.id)})'>ลบ</button>
      </td>`;
    el.appendChild(tr);
  });
  window._memoCache = list;
  checkDupNow();
}

function editFromDb(id){
  loadMemo(id);
  showTab('form');
  window.scrollTo({top:0, behavior:'smooth'});
}

function copyMemo(id){
  const data = (window._memoCache || []).find(d=>d.id===id);
  if (!data) return;
  applyDataToForm(data);
  window._currentId = null;       // สำคัญ: ไม่ผูกกับ id เดิม กด "บันทึกลงระบบ" จะสร้างเป็นรายการใหม่ ไม่ทับของเก่า
  window._currentSavedAt = null;
  setEditingBadge(null);
  setVal('memoNo', (data.memoNo||'') + ' (สำเนา)');
  document.getElementById('saveStatus').textContent = 'คัดลอกมาเป็นรายการใหม่แล้ว — แก้แล้วกด "บันทึกลงระบบ" เพื่อสร้างเป็นรายการแยก';
  setTimeout(()=>{ document.getElementById('saveStatus').textContent=''; }, 4000);
  showTab('form');
  window.scrollTo({top:0, behavior:'smooth'});
}

function loadMemo(id){
  const data = (window._memoCache || []).find(d=>d.id===id);
  if (!data) return;
  window._currentId = data.id;
  window._currentSavedAt = data.savedAt;
  setEditingBadge(data.memoNo);
  applyDataToForm(data);
}

function applyDataToForm(data){
  setVal('companyName', data.companyName); setVal('companyTax', data.companyTax); setVal('companyAddr', data.companyAddr);
  setVal('memoNo', data.memoNo); setVal('memoDate', normalizeDate(data.memoDate));
  setVal('custName', data.custName); setVal('custTax', data.custTax); setVal('custAddr', data.custAddr);
  setVal('refInv', data.refInv); setVal('refItem', data.refItem);
  setVal('details', data.details);
  const tbody = document.getElementById('itemsBody');
  tbody.innerHTML = '';
  (data.items && data.items.length ? data.items : [{desc:'',unitPrice:'',amount:''}]).forEach(it=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><textarea class="desc" rows="1" oninput="autoGrow(this)">${escapeHtml(it.desc||'')}</textarea></td>
      <td class="num"><input type="number" class="unitprice" step="0.01" value="${escapeAttr(it.unitPrice||'')}" oninput="syncAmount(this)"></td>
      <td class="num"><input type="number" class="amount" step="0.01" value="${escapeAttr(it.amount||'')}" data-touched="1"></td>
      <td class="row-actions"><button class="btn remove" onclick="removeRow(this)">ลบ</button></td>`;
    tbody.appendChild(tr);
  });
  // แถวสรุป: รายการเก่าที่เคยติ๊กออก (checked === false) จะไม่นำมาแสดง
  if (Array.isArray(data.summaryItems)){
    document.getElementById('summaryBody').innerHTML = '';
    data.summaryItems.filter(it => it.checked !== false)
      .forEach(it => addSummaryRow(it.desc, it.unitPrice, it.amount));
  } else {
    resetSummaryRows();
  }
  updateTotal();
  document.querySelectorAll('textarea.desc, textarea.sum-desc').forEach(autoGrow);
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteMemo(id){
  if (!confirm('ลบรายการนี้ใช่ไหม?')) return;
  if (window._currentId === id){ window._currentId = null; window._currentSavedAt = null; setEditingBadge(null); }
  showPopup('loading', 'กำลังลบ...', 'กรุณารอสักครู่');
  try{
    await postToBackend({ type: 'delete', id: id });
    showPopup('success', 'ลบแล้ว', '');
  }catch(e){
    showPopup('error', 'ลบไม่สำเร็จ', 'ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
  }
  refreshList();
}

function setVal(id, v){ const el = document.getElementById(id); if (el) el.value = v || ''; }

function fmt(n){
  const num = parseFloat(n);
  if (isNaN(num)) return '0.00';
  return num.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function nl2br(s){ return escapeHtml(s||'').replace(/\n/g, '<br>'); }

// สำคัญ: ทดสอบจริงพบว่าฟีเจอร์ "thead พิมพ์ซ้ำอัตโนมัติทุกหน้า" ของ Chrome/Skia (ที่ใช้ตอน
// Print > Save as PDF) มีบั๊ก (อ้างอิง crbug.com/24826) ที่ทำให้แถวตรงรอยตัดหน้าถูก "ยืด" จน
// เกิดช่องว่างเปล่าๆ ขนาดใหญ่ และบางครั้งแถวเดิมถูกพิมพ์ซ้ำข้ามไปอีกหน้า (เห็นข้อมูลซ้ำ 2 หน้า)
// — เกิดขึ้นแม้ปิด page-break-inside:avoid แล้วก็ตาม เพราะเป็นบั๊กของกลไก thead-repeat เอง
// ไม่ใช่จาก CSS ที่เราเขียน จึงเลิกพึ่งกลไกนี้ทั้งหมด แล้วเปลี่ยนมา "ตัดหน้าเองด้วย JS" แทน:
// วัดความสูงจริงของแต่ละแถว/บล็อกก่อน แล้วแบ่งเป็นหน้าๆ โดยแต่ละหน้าใช้ตารางของตัวเอง
// (ไม่มีตารางไหนต้องข้ามหน้าเลย) จึงไม่ไปโดนบั๊กนี้อีก
function printMemo(){
  const d = collectData();

  const itemRowsData = (d.items||[]).filter(it=>it.desc || it.unitPrice || it.amount);
  const itemRowHtmls = itemRowsData.length
    ? itemRowsData.map(it=>`<tr><td>${nl2br(it.desc)}</td><td>${it.unitPrice?fmt(it.unitPrice):''}</td><td>${fmt(it.amount)}</td></tr>`)
    : ['<tr><td colspan="3" style="text-align:center;color:#777;">-</td></tr>'];

  const detailsHtml = (d.details && d.details.trim()) ? `
    <div class="p-notes">${nl2br(d.details.trim())}</div>` : '';

  const summaryItemsData = (d.summaryItems||[]).filter(it=>it.checked !== false);
  const summaryHtml = summaryItemsData.length ? `
    <div class="p-summary">
      ${summaryItemsData.map(it=>`<div class="p-row"><span>${nl2br(it.desc)}</span><span>${fmt(it.amount)}</span></div>`).join('')}
    </div>` : '';

  // ส่วนท้าย (สรุปยอด + รายละเอียด) — ผู้ใช้ต้องการให้บล็อกนี้ "ชนขอบล่างสุด" ของหน้าที่มันอยู่
  // จึงแยกออกจากแถวรายการ ไม่ยัดรวมเป็นแถวในตารางเดียวกันอีกต่อไป แล้วดันลงล่างด้วย flexbox แทน
  const footerHtml = (summaryHtml || detailsHtml) ? `${summaryHtml}${detailsHtml}` : '';

  const letterheadHtml = `
    <div class="p-repeat-header">
      <div class="p-repeat-title">Credit Memo</div>
      <div class="p-repeat-company">
        <div class="name">${escapeHtml(d.companyName||'')}</div>
        <div>${escapeHtml(d.companyAddr||'')}</div>
        <div>Tax ID : ${escapeHtml(d.companyTax||'')}</div>
      </div>
      <div class="p-repeat-toprow">
        <div class="p-block">
          <div class="label">Customer</div>
          <div>${escapeHtml(d.custName||'')}</div>
          <div>${escapeHtml(d.custAddr||'')}</div>
          <div>Tax ID : ${escapeHtml(d.custTax||'')}</div>
        </div>
        <div class="p-meta">
          <div><b>No :</b> ${escapeHtml(d.memoNo||'')}</div>
          <div><b>Date :</b> ${escapeHtml(d.memoDate||'')}</div>
        </div>
      </div>
      <div class="p-repeat-reference">
        <div class="label">Reference</div>
        <div>Ref. Invoice No : ${escapeHtml(d.refInv||'')}</div>
        <div>Cancelled Item : ${escapeHtml(d.refItem||'')}</div>
      </div>
    </div>`;

  const colHeadHtml = `<tr class="p-col-head"><th>DESCRIPTION</th><th>UNIT PRICE</th><th>AMOUNT</th></tr>`;

  const contentBlocks = itemRowHtmls; // ตอนนี้แบ่งหน้าเฉพาะแถวรายการ ส่วนท้ายจัดการแยกทีหลัง

  const sheet = document.getElementById('printSheet');

  // --- ใช้ #printSheet เป็นพื้นที่ซ่อนไว้วัดความสูงจริง (ต้องแสดงผลชั่วคราวถึงจะวัดได้) ---
  sheet.innerHTML = '';
  sheet.style.cssText = 'display:block;position:fixed;left:-99999px;top:0;visibility:hidden;width:190mm;';

  const MM_TO_PX = 96/25.4;
  const PAGE_HEIGHT_MM = 297 - 16 - 16; // A4 ลบ @page margin บน-ล่างข้างละ 16mm
  const SAFETY = 0.94; // กันเผื่อความคลาดเคลื่อนเล็กน้อยระหว่างวัดบนจอกับพิมพ์จริง
  const pageHeightPx = PAGE_HEIGHT_MM * MM_TO_PX * SAFETY;

  function measurePlainHeight(html){
    const div = document.createElement('div');
    div.innerHTML = html;
    sheet.appendChild(div);
    const h = div.getBoundingClientRect().height;
    sheet.removeChild(div);
    return h;
  }
  const letterheadH = measurePlainHeight(letterheadHtml);
  const footerH = footerHtml ? measurePlainHeight(footerHtml) : 0;

  function measureRowHeight(trHtml){
    const t = document.createElement('table');
    t.className = 'p-page-table';
    t.innerHTML = `<tbody>${trHtml}</tbody>`;
    sheet.appendChild(t);
    const h = t.getBoundingClientRect().height;
    sheet.removeChild(t);
    return h;
  }
  const colHeadH = measureRowHeight(colHeadHtml);
  const blockHeights = contentBlocks.map(measureRowHeight);

  // --- แบ่งหน้า (greedy pack) — letterhead เต็มไปทุกหน้า จึงหักพื้นที่ letterheadH + colHeadH
  // ออกจากงบความสูงของทุกหน้า (ไม่ใช่แค่หน้าแรก) ---
  const pages = [];
  let current = [];
  let usedH = letterheadH + colHeadH;

  contentBlocks.forEach((html, i)=>{
    const h = blockHeights[i];
    if (current.length && usedH + h > pageHeightPx){
      pages.push(current);
      current = [];
      usedH = letterheadH + colHeadH;
    }
    current.push(html);
    usedH += h;
  });
  pages.push(current);
  const usedHLastPage = usedH; // ความสูงที่ใช้ไปแล้วในหน้าสุดท้าย (หลังใส่แถวรายการครบ)

  // --- ตัดสินใจว่าส่วนท้าย (สรุปยอด/รายละเอียด) จะไปอยู่หน้าไหน ---
  // ถ้าเหลือที่พอในหน้าสุดท้าย ให้ไปอยู่หน้าเดียวกับแถวรายการ (แล้วดันชนขอบล่าง)
  // ถ้าไม่พอ ให้ขึ้นหน้าใหม่อีกหน้าเฉพาะส่วนท้าย (ก็ยังชนขอบล่างของหน้านั้นเหมือนกัน)
  let footerPageIndex = -1;
  if (footerHtml){
    const remainingOnLastPage = pageHeightPx - usedHLastPage;
    if (footerH <= remainingOnLastPage){
      footerPageIndex = pages.length - 1;
    } else {
      pages.push([]); // หน้าใหม่ ไว้สำหรับส่วนท้ายอย่างเดียว
      footerPageIndex = pages.length - 1;
    }
  }

  // --- สร้าง HTML สุดท้ายสำหรับพิมพ์: แต่ละหน้าเป็นตารางของตัวเอง ไม่มีตารางไหนข้ามหน้า
  // มี letterhead เต็มซ้ำทุกหน้า และส่วนท้ายถูกดันให้ชนขอบล่างสุดของหน้าที่มันอยู่ ---
  const pagesHtml = pages.map((rows, idx)=>{
    const isLast = idx === pages.length - 1;
    const hasFooterHere = idx === footerPageIndex;
    const itemsTableHtml = rows.length ? `
      <table class="p-page-table">
        <thead>${colHeadHtml}</thead>
        <tbody>${rows.join('')}</tbody>
      </table>` : '';
    return `
    <div class="p-print-page"${!isLast ? ' style="page-break-after:always;"' : ''}>
      ${letterheadHtml}
      ${itemsTableHtml}
      ${hasFooterHere ? `<div class="p-footer-push">${footerHtml}</div>` : ''}
    </div>`;
  }).join('');

  sheet.style.cssText = '';
  sheet.innerHTML = pagesHtml;
  window.print();
}
window.addEventListener('afterprint', ()=>{ document.getElementById('printSheet').innerHTML = ''; });
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
</script>
<div id="popup" class="popup-overlay" role="alertdialog" aria-live="assertive">
  <div class="popup-card">
    <div id="popupIcon"></div>
    <div id="popupMsg" class="popup-msg"></div>
    <div id="popupSub" class="popup-sub"></div>
    <button id="popupClose" class="btn popup-close" style="display:none;" onclick="hidePopup()">ปิด</button>
  </div>
</div>
</body>
</html>
